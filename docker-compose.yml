name: voice-fairy-tale

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:-voice}@database:5432/${POSTGRES_DB:-voice}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      MODEL_PATH: /data/models
      USE_MOCK_INFERENCE: ${USE_MOCK_INFERENCE:-true}
    ports:
      - "8000:8000"
    volumes:
      - voice_storage:/data/storage
      - model_cache:/data/models
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD:-voice}@database:5432/${POSTGRES_DB:-voice}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PATH: /data/storage
      MODEL_PATH: /data/models
      CUDA_DEVICE: ${CUDA_DEVICE:-cuda:0}
      MODEL_CACHE_LIMIT: ${MODEL_CACHE_LIMIT:-2}
      GPU_VRAM_RESERVE_MB: ${GPU_VRAM_RESERVE_MB:-512}
      USE_MOCK_INFERENCE: ${USE_MOCK_INFERENCE:-true}
    volumes:
      - voice_storage:/data/storage
      - model_cache:/data/models
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voice}
      POSTGRES_USER: ${POSTGRES_USER:-voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voice} -d ${POSTGRES_DB:-voice}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  voice_storage:
  model_cache:

